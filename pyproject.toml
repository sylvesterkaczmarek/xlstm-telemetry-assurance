[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlstm-telemetry-assurance"
version = "0.1.0"
description = "xLSTM-style streaming forecasting and runtime assurance for spacecraft and robotics telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
