[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlstm-telemetry-assurance"
version = "0.1.0"
description = "xLSTM-style streaming forecasting and runtime assurance for spacecraft and robotics telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "build>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
